<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<!-- Floating animated orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="tab-content">
  <!-- Brand logo -->
  <div class="brand">
    <h1>SkillStreet</h1>
  </div>
  
  <!-- Pills navs -->
  <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
    <li class="nav-item" role="presentation">
      <a class="nav-link active" id="tab-login" data-mdb-pill-init href="#pills-login" role="tab"
        aria-controls="pills-login" aria-selected="true">Login</a>
    </li>
    <li class="nav-item" role="presentation">
      <a class="nav-link" id="tab-register" data-mdb-pill-init href="#pills-register" role="tab"
        aria-controls="pills-register" aria-selected="false">Register</a>
    </li>
  </ul>
  <!-- Pills navs -->

  <!-- Auth message display -->
  <div id="authMessage" class="text-center mb-3" style="padding: 10px; border-radius: 5px; display: none;"></div>

  <!-- Pills content -->
  <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
    <form id="loginForm">
      <div class="text-center mb-3">
        <p>Sign in with:</p>
        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="facebook" aria-label="Sign in with Facebook" title="Sign in with Facebook">
          <i class="fab fa-facebook-f"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="google" aria-label="Sign in with Google" title="Sign in with Google">
          <i class="fab fa-google"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="twitter" aria-label="Sign in with Twitter" title="Sign in with Twitter">
          <i class="fab fa-twitter"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="github" aria-label="Sign in with GitHub" title="Sign in with GitHub">
          <i class="fab fa-github"></i>
        </button>
      </div>

      <p class="text-center">or:</p>

      <!-- Email input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="email" id="loginEmail" class="form-control" required />
        <label class="form-label" for="loginEmail">Email</label>
      </div>

      <!-- Password input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="password" id="loginPassword" class="form-control" required />
        <label class="form-label" for="loginPassword">Password</label>
      </div>

      <!-- 2 column grid layout -->
      <div class="row mb-4">
        <div class="col-md-6 d-flex justify-content-center">
          <!-- Checkbox -->
          <div class="form-check mb-3 mb-md-0">
            <input class="form-check-input" type="checkbox" value="" id="loginCheck" checked />
            <label class="form-check-label" for="loginCheck"> Remember me </label>
          </div>
        </div>

        <div class="col-md-6 d-flex justify-content-center">
          <!-- Simple link -->
          <a href="forgotpassword.html">Forgot password?</a>
        </div>
      </div>

      <!-- Submit button -->
      <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">Login</button>

      <!-- Register buttons -->
      <div class="text-center">
        <p>Not a member? <a href="#pills-register" class="switch-tab-link" data-target="pills-register">Register</a></p>
      </div>
    </form>
  </div>
  <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="tab-register">
    <form id="registerForm">
      <div class="text-center mb-3">
        <p>Sign up with:</p>
        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="facebook" aria-label="Sign up with Facebook" title="Sign up with Facebook">
          <i class="fab fa-facebook-f"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="google" aria-label="Sign up with Google" title="Sign up with Google">
          <i class="fab fa-google"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="twitter" aria-label="Sign up with Twitter" title="Sign up with Twitter">
          <i class="fab fa-twitter"></i>
        </button>

        <button type="button" class="btn btn-link btn-floating mx-1 social-auth-btn" data-provider="github" aria-label="Sign up with GitHub" title="Sign up with GitHub">
          <i class="fab fa-github"></i>
        </button>
      </div>

      <p class="text-center">or:</p>

      <!-- Username input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="text" id="registerUsername" class="form-control" required />
        <label class="form-label" for="registerUsername">Username</label>
      </div>

      <!-- Email input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="email" id="registerEmail" class="form-control" required />
        <label class="form-label" for="registerEmail">Email</label>
      </div>

      <!-- Password input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="password" id="registerPassword" class="form-control" required minlength="6" />
        <label class="form-label" for="registerPassword">Password</label>
      </div>

      <!-- Repeat Password input -->
      <div data-mdb-input-init class="form-outline mb-4">
        <input type="password" id="registerRepeatPassword" class="form-control" required />
        <label class="form-label" for="registerRepeatPassword">Repeat password</label>
      </div>

      <!-- Password match error message -->
      <div id="passwordError" class="text-center mb-4" style="color: #e74c3c; font-size: 14px; display: none;">
        Passwords do not match
      </div>

      <!-- Checkbox -->
      <div class="form-check d-flex justify-content-center mb-4">
        <input class="form-check-input me-2" type="checkbox" value="" id="registerCheck" checked
          aria-describedby="registerCheckHelpText" />
        <label class="form-check-label" for="registerCheck">
          I have read and agree to the terms
        </label>
      </div>

      <!-- Submit button -->
      <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-3">Register</button>
    </form>
  </div>
</div>
<!-- Pills content -->

<!-- Firebase SDK -->
<script type="module">
  // Import Firebase modules
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { 
    getAuth, 
    signInWithEmailAndPassword, 
    createUserWithEmailAndPassword,
    signInWithPopup,
    GoogleAuthProvider,
    FacebookAuthProvider,
    TwitterAuthProvider,
    GithubAuthProvider,
    updateProfile,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    browserSessionPersistence,
    sendEmailVerification
  } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

  // Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD8FLY3Yo6g8eAFJMTgPuOaH_Rv5XIojas",
    authDomain: "skillstreetofficial.firebaseapp.com",
    projectId: "skillstreetofficial",
    storageBucket: "skillstreetofficial.firebasestorage.app",
    messagingSenderId: "1518002311",
    appId: "1:1518002311:web:24acfa0a6e7fa84e951822",
    measurementId: "G-JXWT315DGQ"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Auth providers
  const googleProvider = new GoogleAuthProvider();
  const facebookProvider = new FacebookAuthProvider();
  const twitterProvider = new TwitterAuthProvider();
  const githubProvider = new GithubAuthProvider();

  // UI Elements
  const authMessage = document.getElementById('authMessage');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const passwordInput = document.getElementById('registerPassword');
  const repeatPasswordInput = document.getElementById('registerRepeatPassword');
  const passwordError = document.getElementById('passwordError');
  const socialAuthButtons = document.querySelectorAll('.social-auth-btn');
  const tabLinks = document.querySelectorAll('.nav-link');
  const tabPanes = document.querySelectorAll('.tab-pane');
  const switchTabLinks = document.querySelectorAll('.switch-tab-link');

  // Show message function
  function showMessage(message, type) {
    authMessage.textContent = message;
    authMessage.style.display = 'block';
    if (type === 'error') {
      authMessage.style.background = '#fee';
      authMessage.style.color = '#c33';
      authMessage.style.border = '1px solid #fcc';
    } else if (type === 'success') {
      authMessage.style.background = '#efe';
      authMessage.style.color = '#3c3';
      authMessage.style.border = '1px solid #cfc';
    }
    setTimeout(() => {
      authMessage.style.display = 'none';
    }, 5000);
  }

  // Tab switching functionality
  function showTab(targetId) {
    tabLinks.forEach(link => {
      const isActive = link.getAttribute('href') === `#${targetId}`;
      link.classList.toggle('active', isActive);
      link.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });

    tabPanes.forEach(pane => {
      pane.classList.remove('show', 'active');
    });

    const targetPane = document.getElementById(targetId);
    if (targetPane) {
      targetPane.classList.add('show', 'active');
    }
  }

  tabLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('href').substring(1);
      showTab(targetId);
    });
  });

  switchTabLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      showTab(this.dataset.target);
    });
  });

  // Password validation
  registerForm.addEventListener('submit', function(e) {
    if (passwordInput.value !== repeatPasswordInput.value) {
      e.preventDefault();
      passwordError.style.display = 'block';
      return false;
    } else {
      passwordError.style.display = 'none';
    }
  });

  repeatPasswordInput.addEventListener('input', function() {
    if (passwordInput.value === repeatPasswordInput.value) {
      passwordError.style.display = 'none';
    }
  });

  // Social authentication
  function getProvider(providerName) {
    switch(providerName) {
      case 'google': return googleProvider;
      case 'facebook': return facebookProvider;
      case 'twitter': return twitterProvider;
      case 'github': return githubProvider;
      default: return googleProvider;
    }
  }

  socialAuthButtons.forEach(button => {
    button.addEventListener('click', async () => {
      const providerName = button.dataset.provider;
      const provider = getProvider(providerName);
      
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        showMessage(`Welcome ${user.displayName || user.email}! Redirecting...`, 'success');
        
        // Store user info in localStorage
        localStorage.setItem('user', JSON.stringify({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          photoURL: user.photoURL
        }));
        
        // Redirect to home page after 2 seconds
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 2000);
      } catch (error) {
        showMessage(error.message, 'error');
        console.error('Auth error:', error);
      }
    });
  });

  // Email/Password Login with email verification check
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const rememberMe = document.getElementById('loginCheck').checked;
    
    try {
      // Set persistence based on remember me
      await setPersistence(auth, rememberMe ? browserLocalPersistence : browserSessionPersistence);
      
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      
      // Check if email is verified
      if (!user.emailVerified) {
        showMessage('Please verify your email before logging in. Check your inbox for the verification link.', 'error');
        // Sign out the user since email is not verified
        await auth.signOut();
        return;
      }
      
      showMessage('Login successful! Redirecting...', 'success');
      
      // Store user info
      localStorage.setItem('user', JSON.stringify({
        uid: user.uid,
        email: user.email,
        displayName: user.displayName
      }));
      
      // Redirect to home page
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    } catch (error) {
      let errorMessage = 'Login failed. Please try again.';
      switch(error.code) {
        case 'auth/user-not-found':
          errorMessage = 'No account found with this email.';
          break;
        case 'auth/wrong-password':
          errorMessage = 'Incorrect password.';
          break;
        case 'auth/invalid-email':
          errorMessage = 'Invalid email address.';
          break;
        case 'auth/too-many-requests':
          errorMessage = 'Too many attempts. Please try again later.';
          break;
      }
      showMessage(errorMessage, 'error');
      console.error('Login error:', error);
    }
  });

  // Email/Password Registration with verification
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = document.getElementById('registerUsername').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;
    const repeatPassword = document.getElementById('registerRepeatPassword').value;
    
    // Check password match
    if (password !== repeatPassword) {
      passwordError.style.display = 'block';
      return;
    }
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;
      
      // Update user profile with username
      await updateProfile(user, {
        displayName: username
      });
      
      // Send email verification
      await sendEmailVerification(user);
      
      showMessage('Account created! Please check your email to verify your account before logging in.', 'success');
      
      // Switch to login tab after 3 seconds
      setTimeout(() => {
        showTab('pills-login');
      }, 3000);
    } catch (error) {
      let errorMessage = 'Registration failed. Please try again.';
      switch(error.code) {
        case 'auth/email-already-in-use':
          errorMessage = 'An account with this email already exists.';
          break;
        case 'auth/invalid-email':
          errorMessage = 'Invalid email address.';
          break;
        case 'auth/weak-password':
          errorMessage = 'Password should be at least 6 characters.';
          break;
      }
      showMessage(errorMessage, 'error');
      console.error('Registration error:', error);
    }
  });

  // Auth state listener
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User is signed in
      console.log('User is signed in:', user.email);
      
      // Update stored user info
      localStorage.setItem('user', JSON.stringify({
        uid: user.uid,
        email: user.email,
        displayName: user.displayName,
        photoURL: user.photoURL
      }));
    } else {
      // User is signed out
      console.log('User is signed out');
      localStorage.removeItem('user');
    }
  });
</script>
</body>
</html>
