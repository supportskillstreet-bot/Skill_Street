<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgotpassword.css">
</head>
<body>
    <div class="tab-content">
        <div class="text-center mb-3">
            <h2>Reset Password</h2>
            <p>Enter your email and choose a new password.</p>
        </div>

        <form action="#" method="post">
            <div class="form-outline mb-4">
                <input type="email" name="email" id="email" class="form-control" placeholder=" " required>
                <label class="form-label" for="email">Your email</label>
            </div>

            <div class="form-outline mb-4">
                <input type="password" name="password" id="password" class="form-control" placeholder=" " required>
                <label class="form-label" for="password">New password</label>
            </div>

            <div class="form-outline mb-4">
                <input type="password" name="confirm-password" id="confirm-password" class="form-control" placeholder=" " required>
                <label class="form-label" for="confirm-password">Confirm password</label>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label" for="terms">
                    I accept the Terms and Conditions
                </label>
                <a href="Privacy Policy & TC skillstreet.pdf" target="_blank">Terms and Conditions</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block mb-4">Reset Password</button>

            <div class="text-center">
                <p>Remembered your password? <a href="login.html">Back to Login</a></p>
            </div>
        </form>
    </div>
</body>
</html>
