<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillStreet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
<!-- Floating animated orbs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="tab-content">
  <!-- Brand logo -->
  <div class="brand">
    <h1>SkillStreet</h1>
  </div>
  
  <div class="text-center mb-3">
    <h2 style="color: #1e293b; font-size: 20px; margin-bottom: 10px;">Reset Password</h2>
    <p style="color: #64748b; font-size: 14px;">Enter your email and we'll send you a link to reset your password.</p>
  </div>

  <!-- Auth message display -->
  <div id="authMessage" class="text-center mb-3" style="padding: 10px; border-radius: 5px; display: none;"></div>

  <form id="resetForm">
    <!-- Email input -->
    <div data-mdb-input-init class="form-outline mb-4">
      <input type="email" id="email" class="form-control" required />
      <label class="form-label" for="email">Email</label>
    </div>

    <!-- Submit button -->
    <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">
      <i class="fas fa-paper-plane"></i> Send Reset Link
    </button>

    <!-- Back to login -->
    <div class="text-center">
      <p>Remembered your password? <a href="login.html">Back to Login</a></p>
    </div>
  </form>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
  
  const firebaseConfig = {
    apiKey: "AIzaSyD8FLY3Yo6g8eAFJMTgPuOaH_Rv5XIojas",
    authDomain: "skillstreetofficial.firebaseapp.com",
    projectId: "skillstreetofficial",
    storageBucket: "skillstreetofficial.firebasestorage.app",
    messagingSenderId: "1518002311",
    appId: "1:1518002311:web:24acfa0a6e7fa84e951822",
    measurementId: "G-JXWT315DGQ"
  };
  
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  
  const resetForm = document.getElementById('resetForm');
  const authMessage = document.getElementById('authMessage');
  
  function showMessage(message, type) {
    authMessage.textContent = message;
    authMessage.style.display = 'block';
    if (type === 'error') {
      authMessage.style.background = '#fee';
      authMessage.style.color = '#c33';
      authMessage.style.border = '1px solid #fcc';
    } else if (type === 'success') {
      authMessage.style.background = '#efe';
      authMessage.style.color = '#3c3';
      authMessage.style.border = '1px solid #cfc';
    }
  }
  
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const submitBtn = resetForm.querySelector('button[type="submit"]');
    
    if (!email) {
      showMessage('Please enter your email address.', 'error');
      return;
    }
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
    
    try {
      await sendPasswordResetEmail(auth, email);
      showMessage('Password reset email sent! Check your inbox.', 'success');
      document.getElementById('email').value = '';
    } catch (error) {
      let errorMessage = 'Failed to send reset email. Please try again.';
      
      switch(error.code) {
        case 'auth/user-not-found':
          errorMessage = 'No account found with this email address.';
          break;
        case 'auth/invalid-email':
          errorMessage = 'Please enter a valid email address.';
          break;
        case 'auth/too-many-requests':
          errorMessage = 'Too many attempts. Please try again later.';
          break;
      }
      
      showMessage(errorMessage, 'error');
      console.error('Password reset error:', error);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
    }
  });
</script>
</body>
</html>
