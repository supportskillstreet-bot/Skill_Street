<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>

   
 
    <link rel="stylesheet" href="contact.css" class="css">
</head>
 
<body>
    <section class="contact">
        <div class="content">
            
            <h2>Contact Us</h2>
            <p>Welcome to skillstreet . Please write your query below , we will be happy to help you out.</p>
        </div>
        <div class="container-query">
            <div class="contactinfo">
                <div class="box">
                    <div class="icon"><ion-icon name="home"></ion-icon></div>
                     <div class="text">
                        <h1>Address</h1>
                        <p>Dwarka mor , New delhi 110059</p>
                    </div>
                </div>
                <hr>
                <div class="box">
                    <div class="icon"><ion-icon name="mail"></ion-icon></div>
                    <div class="text">
                        <h1>E-mail address</h1>
                        <p>support.skillstreet@gmail.com</p>
                    </div>
                </div>
                <hr>
                     <div class="box">
                    <div class="icon"><ion-icon name="call"></ion-icon></div>
                    <div class="text">
                        <h1>Contact number</h1>
                        <p>+91 96251 71326</p>
                    </div>
                     </div>
                </div>


                

           
            <div class="contactform">
               
                    <h2>Send Message</h2>
                     <form action="mailto:support.skillstreet@gmail.com" method="post" enctype="text/plain">
                    <div class="inputbox">
                        <input type="text" id="name" name="name" required="required">
                        <label for="name">Name</label>
                    </div>
                    <div class="inputbox">
                        <input type="text" id="subject" name="subject" required="required">
                        <label for="subject">Subject</label>
                    </div>
                    <div class="inputbox">
                        <input type="email" id="email" name="email" required="required">
                        <label for="email">Email</label>
                    </div>
                    <div class="inputbox">
                        <textarea required="required" id="message" name="message"></textarea>
                        <label for="message">Message</label>
                    </div>
                    <div class="inputbox">
                       <button type="submit" class="submit">Send</button> 
                    </div>
               </form>
            </div>
        </div>
    </section>
   
     <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    
    
</body>
</html>
